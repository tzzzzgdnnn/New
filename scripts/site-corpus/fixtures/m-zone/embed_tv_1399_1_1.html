  <script>
    // Runs before hashed assets load so stale or missing CSS/JS can recover
    // to the newest deployment without an infinite refresh loop.
    (() => {
      const key = 'mzone:stale-chunk-reload';
      let requested = false;

      window.__mzoneReloadFreshAssets = (force = false) => {
        if (requested) return;

        const now = Date.now();
        let lastReload = 0;
        try {
          lastReload = Number(sessionStorage.getItem(key) || 0);
        } catch (_) {}

        if (!force && now - lastReload < 60000) return;
        requested = true;
        try {
          sessionStorage.setItem(key, String(now));
        } catch (_) {}

        const url = new URL(location.href);
        url.searchParams.set('mzone-refresh', String(now));
        url.searchParams.delete('vite-reloaded');
        url.searchParams.delete('t');
        location.replace(url.toString());
      };

      addEventListener('error', (event) => {
        const target = event.target;
        const assetUrl = target && (target.src || target.href || '');
        if (!String(assetUrl).includes('/assets/')) return;
        event.preventDefault();
        window.__mzoneReloadFreshAssets();
      }, true);

      // Vite reports failed lazy chunks through this event rather than the
      // element-level error path above. A deployment can briefly leave one
      // edge serving an older runtime while another serves the new assets.
      addEventListener('vite:preloadError', (event) => {
        event.preventDefault();
        window.__mzoneReloadFreshAssets(true);
      });

      addEventListener('unhandledrejection', (event) => {
        const message = String(event.reason?.message || event.reason || '');
        if (!/(?:dynamically imported module|module script failed|failed to fetch.*module)/i.test(message)) return;
        event.preventDefault();
        window.__mzoneReloadFreshAssets(true);
      });
    })();
  </script>
