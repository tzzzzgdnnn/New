        if(!fe||!fe.hasAttribute)return 'unknown';
        if(fe.hasAttribute('sandbox'))return 'sandboxed';
        w=w.parent;
      }
    }catch(e){ return 'unknown'; }
    return 'clean';

  function pvReset(url,kind){

  function pvBuild(){

    if(!window.Hls||!Hls.isSupported()){ pvDead=true; return; }
    if(!pvVideo){
      pvVideo=document.createElement('video');

      pvVideo.style.cssText='position:absolute;width:1px;height:1px;opacity:0;'

      pvVideo.addEventListener('seeked',pvCapture);
      pvVideo.addEventListener('error',function(){ pvDead=true; });
    }
    try{
      pvHls=new Hls({maxBufferLength:2,maxMaxBufferLength:4,startLevel:0});
      pvHls.loadSource(pvUrl);
      pvHls.attachMedia(pvVideo);
      pvHls.on(Hls.Events.MANIFEST_PARSED,function(){
        try{ pvHls.currentLevel=0; }catch(e){}

  var HOLD_MS=900;

        .then(function(r){if(!r.ok){judged=true;throw 0;}return r.text();})
        .then(function(txt){
