www.hbo.com/game-of-thrones\",\"id\":\"1399\",\"in_production\":false,\"languages\":[\"en\"],\"last_air_date\":\"2019-05-19\",\"last_episode_to_air\":{\"id\":1551830,\"name\":\"The Iron Throne\",\"overview\":\"In the aftermath of the devastating attack on King's Landing, Daenerys must face the survivors.\",\"vote_average\":4.469,\"vote_count\":480,\"air_date\":\"2019-05-19\",\"episode_number\":6,\"episode_type\":\"finale\",\"production_code\":\"806\",\"runtime\":80,\"season_number\":8,\"show_id\":1399,\"still_path\":\"/zBi2O5EJfgTS6Ae0HdAYLm9o2nf.jpg\"},\"name\":\"Game of Thrones\",\"next_episode_to_air\":null,\"networks\":[{\"id\":49,\"logo_path\":\"/tuomPhY2UtuPTqqFnKMVHvSb724.png\",\"name\":\"HBO\",\"origin_country\":\"US\"}],\"number_of_episodes\":73,\"number_of_seasons\":8,\"origin_country\":[\"US\"],\"original_language\":\"en\",\"original_name\":\"Game of Thrones\",\"overview\":\"Seven noble families fight for control of the mythical land of Westeros. Friction between the houses leads to full-scale war. All while a very ancient evil awakens in the farthest north. Amidst the war, a neglected military order of misfits, the Night's Watch, is all that stands between the realms of men and icy horrors beyond.\",\"popularity\":164.7115,\"poster_path\":\"/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg\",\"production_companies\":[{\"id\":12525,\"logo_path\":null,\"name\":\"Television 360\",\"origin_country\":\"US\"},{\"id\":5820,\"logo_path\":null,\"name\":\"Generator Entertainment\",\"origin_country\":\"GB\"},{\"id\":12526,\"logo_path\":null,\"name\":\"Bighead Littlehead\",\"origin_country\":\"US\"},{\"id\":286828,\"logo_path\":null,\"name\":\"Grok! Television\",\"origin_country\":\"US\"},{\"id\":3268,\"logo_path\":\"/tuomPhY2UtuPTqqFnKMVHvSb724.png\",\"name\":\"HBO\",\"origin_country\":\"US\"},{\"id\":258229,\"logo_path\":null,\"name\":\"Startling Television\",\"origin_country\":\"US\"}],\"production_countries\":[{\"iso_3166_1\":\"GB\",\"name\":\"United Kingdom\"},{\"iso_3166_1\":\"US\",\"name\":\"United States of America\"}],\"seasons\":[{\"air_date\":\"2010-12-05\",\"episode_count\":300,\"id\":3627,\"name\":\"Specials\",\"overview\":\"\",\"poster_path\":\"/aos6lC1JGYt6ZRL85lgstNsfSeY.jpg\",\"season_number\":0,\"vote_average\":0},{\"air_date\":\"2011-04-17\",\"episode_count\":10,\"id\":3624,\"name\":\"Season 1\",\"overview\":\"Trouble is brewing in the Seven Kingdoms of Westeros. For the driven inhabitants of this visionary world, control of Westeros' Iron Throne holds the lure of great power. But in a land where the seasons can last a lifetime, winter is coming...and beyond the Great Wall that protects them, an ancient evil has returned. In Season One, the story centers on three primary areas: the Stark and the Lannister families, whose designs on controlling the throne threaten a tenuous peace; the dragon princess Daenerys, heir to the former dynasty, who waits just over the Narrow Sea with her malevolent brother Viserys; and the Great Wall--a massive barrier of ice where a forgotten danger is stirring.\",\"poster_path\":\"/wgfKiqzuMrFIkU1M68DDDY8kGC1.jpg\",\"season_number\":1,\"vote_average\":8.4},{\"air_date\":\"2012-04-01\",\"episode_count\":10,\"id\":3625,\"name\":\"Season 2\",\"overview\":\"The cold winds of winter are rising in Westeros...war is coming...and five kings continue their savage quest for control of the all-powerful Iron Throne. With winter fast approaching, the coveted Iron Throne is occupied by the cruel Joffrey, counseled by his conniving mother Cersei and uncle Tyrion. But the Lannister hold on the Throne is under assault on many fronts. Meanwhile, a new leader is rising among the wildings outside the Great Wall, adding new perils for Jon Snow and the order of the Night's Watch.\",\"poster_path\":\"/9xfNkPwDOqyeUvfNhs1XlWA0esP.jpg\",\"season_number\":2,\"vote_average\":8.3},{\"air_date\":\"2013-03-31\",\"episode_count\":10,\"id\":3626,\"name\":\"Season 3\",\"overview\":\"Duplicity and treachery...nobility and honor...conquest and triumph...and, of course, dragons. In Season 3, family and loyalty are the overarching themes as many critical storylines from the first two seasons come to a brutal head. Meanwhile, the Lannisters maintain their hold on King's Landing, though stirrings in the North threaten to alter the balance of power; Robb Stark, King of the North, faces a major calamity as he tries to build on his victories; a massive army of wildlings led by Mance Rayder march for the Wall; and Daenerys Targaryen--reunited with her dragons--attempts to raise an army in her quest for the Iron Throne.\",\"poster_path\":\"/5MkZjRnCKiIGn3bkXrXfndEzqOU.jpg\",\"season_number\":3,\"vote_average\":8.4},{\"air_date\":\"2014-04-06\",\"episode_count\":10,\"id\":3628,\"name\":\"Season 4\",\"overview\":\"The War of the Five Kings is drawing to a close, but new intrigues and plots are in motion, and the surviving factions must contend with enemies not only outside their ranks, but within.\",\"poster_path\":\"/jXIMScXE4J4EVHUba1JgxZnWbo4.jpg\",\"season_number\":4,\"vote_average\":8.5},{\"air_date\":\"2015-04-12\",\"episode_count\":10,\"id\":62090,\"name\":\"Season 5\",\"overview\":\"The War of the Five Kings, once thought to be drawing to a close, is instead entering a new and more chaotic phase. Westeros is on the brink of collapse, and many are seizing what they can while the realm implodes, like a corpse making a feast for crows.\",\"poster_path\":\"/7Q1Hy1AHxAzA2lsmzEMBvuWTX0x.jpg\",\"season_number\":5,\"vote_average\":8.2},{\"air_date\":\"2016-04-24\",\"episode_count\":10,\"id\":71881,\"name\":\"Season 6\",\"overview\":\"Following the shocking developments at the conclusion of season five, survivors from all parts of Westeros and Essos regroup to press forward, inexorably, towards their uncertain individual fates. Familiar faces will forge new alliances to bolster their strategic chances at survival, while new characters will emerge to challenge the balance of power in the east, west, north
