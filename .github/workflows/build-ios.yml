name: Build iOS (unsigned IPA)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label"
        default: "macos-15-intel"
  push:
    branches: [main, ipa-test-build]
    paths-ignore:
      - "servers.json"

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Unlisted install page: https://tzzzzgdnnn.github.io/New/get/<token>/
  # Only people with the link can find it (not linked anywhere on the site).
  INSTALL_TOKEN: a3a158950610bf718216

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Cache Xcode build (DerivedData + Swift packages)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData
            ${{ runner.temp }}/SourcePackages
          key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/App/App.xcodeproj/project.pbxproj', 'ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}-${{ hashFiles('ios/App/App/**/*.swift') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/App/App.xcodeproj/project.pbxproj', 'ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}-
            xcode-${{ runner.os }}-${{ runner.arch }}-

      - name: Download math tests (Swift)
        run: npm run test:swift

      - name: Watch Together tests (sync engine, room, worker)
        run: node --test watch-together/test.mjs watch-together/p2p.test.mjs

      - name: Build web (iOS mode)
        # TMDB token is built in via .env.ios
        run: npx vite build --mode ios

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -list
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION=2.7.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*Swift|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" || { grep -n "error:" "$RUNNER_TEMP/xcodebuild.log" | head -40; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry Super-Player.ipa Payload
          ls -lh Super-Player.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Super-Player-unsigned
          path: ${{ runner.temp }}/ipa/Super-Player.ipa
          if-no-files-found: error

      - name: Publish private install page (SideInstaller one-tap)
        if: github.ref == 'refs/heads/ipa-test-build'
        run: sh scripts/publish-install-page.sh "$RUNNER_TEMP/ipa/Super-Player.ipa" "2.7.${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
