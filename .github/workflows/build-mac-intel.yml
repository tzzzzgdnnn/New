name: Build Mac Intel (x64)
on:
  push:
    branches: [mac-intel]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            node_modules
          key: macos-electron-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm ci
      - name: Build macOS (Intel x64)
        run: npx cross-env ELECTRON_DIST=1 vite build && npx electron-builder --mac dmg --x64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-x64
          path: |
            dist/*.dmg
            dist/*.zip
